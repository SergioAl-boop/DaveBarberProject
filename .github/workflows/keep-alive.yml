name: Mantener Supabase activo

on:
  schedule:
    - cron: "0 14 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL=$(echo "$SB_URL" | tr -d '[:space:]')
          KEY=$(echo "$SB_KEY" | tr -d '[:space:]')
          curl -sf "$URL/rest/v1/servicios?select=id&limit=1" -H "apikey: $KEY"