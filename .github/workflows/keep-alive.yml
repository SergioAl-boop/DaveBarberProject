name: Mantener Supabase activo

on:
  schedule:
    - cron: "0 14 */3 * *"  
  workflow_dispatch:          

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/servicios?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"